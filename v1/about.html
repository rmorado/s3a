document.getElementById('app').innerHTML = "<header class=\"site-header\">\n  <h1>Municipality of Tarnmose</h1>\n  <p>Official town website</p>\n</header>\n<nav class=\"site-nav\"><a href=\"index.html\">Home</a><a href=\"birth-certificate.html\">Birth certificate copies</a><a href=\"about.html\">About this site</a></nav>\n<main>\n  <h2>About this site</h2>\n  <p><strong>Tarnmose is not a real place.</strong> This website was created for the LAS (LLM Access\n  Score) research project, which studies how AI systems reach, read and operate public-sector\n  websites.</p>\n  <p>Every fact on this site &mdash; fees, processing times, office names, eligibility rules &mdash;\n  is invented. Nothing here describes any real municipality, government or service, and no national\n  symbols, real place names or real domains are imitated.</p>\n  <p>The site collects no data, contains no working forms, and is served as static pages. Several\n  near-identical copies of this site exist, each differing in one technical property; they are used\n  to measure how those properties affect automated retrieval.</p>\n  <p>Contact: github.com/rmorado</p>\n</main>\n";
