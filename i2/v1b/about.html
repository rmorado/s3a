<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About this site — Tarnmose</title>
<meta name="description" content="Research disclosure for this fictional municipal website.">
<style>
  :root { --civic:#1b3a5c; --civic-dark:#0f2540; --pale:#e8eef4; --paper:#fbfbf9;
    --ink:#22282f; --rule:#c7d1db; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:Georgia,"Times New Roman",Times,serif; line-height:1.6; }
  header.site-header { background:var(--civic); color:#fff; padding:1.25rem 1rem;
    text-align:center; border-bottom:4px solid var(--civic-dark); }
  header.site-header h1 { margin:0; font-size:1.9rem; letter-spacing:.02em; }
  header.site-header p { margin:.4rem 0 0; font-family:Arial,Helvetica,sans-serif;
    font-size:.85rem; color:var(--pale); letter-spacing:.04em; text-transform:uppercase; }
  nav.site-nav { background:var(--civic-dark); text-align:center; padding:.6rem 0; }
  nav.site-nav a { color:#fff; font-family:Arial,Helvetica,sans-serif; font-size:.9rem;
    margin:0 .9rem; text-decoration:none; }
  nav.site-nav a:hover { text-decoration:underline; }
  main { max-width:760px; margin:0 auto; padding:2rem 1rem; }
  main h2 { font-size:1.6rem; color:var(--civic); border-bottom:2px solid var(--rule);
    padding-bottom:.3rem; margin-top:2rem; }
  main h3 { font-size:1.15rem; color:var(--civic-dark); margin-top:1.6rem; }
  dl.facts { background:#fff; border:1px solid var(--rule); padding:1rem 1.25rem; }
  dl.facts dt { font-family:Arial,Helvetica,sans-serif; font-size:.8rem;
    text-transform:uppercase; letter-spacing:.05em; color:var(--civic); margin-top:.8rem; }
  dl.facts dt:first-child { margin-top:0; }
  dl.facts dd { margin:.2rem 0 0; font-size:1.05rem; }
  a.cta { display:inline-block; background:var(--civic); color:#fff; padding:.7rem 1.4rem;
    text-decoration:none; font-family:Arial,Helvetica,sans-serif; margin-top:1rem; }
  footer.site-footer { background:var(--civic-dark); color:#fff; padding:1.5rem 1rem;
    margin-top:2.5rem; font-family:Arial,Helvetica,sans-serif; font-size:.85rem; }
  footer.site-footer p { max-width:760px; margin:0 auto; }
</style>
</head>
<body>
<div id="app"></div>
<script>
fetch('content/about.json')
  .then(function (r) { return r.json(); })
  .then(function (d) { document.getElementById('app').innerHTML = d.html; });
</script>
<footer class="site-footer">
  <p class="research-notice">Research notice: This is a fictional website, part of a study of how AI systems retrieve public-sector information (the LAS project). The municipality of Tarnmose does not exist; all information here is invented. Contact: github.com/rmorado.</p>
</footer>
</body>
</html>
